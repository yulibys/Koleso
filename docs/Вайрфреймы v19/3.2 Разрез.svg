<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="3.2 Разрез"><rect width="1440" height="900" fill="#EDEDED"/><rect x="420" y="0" width="600" height="900" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="720.0" y="456.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">разрез: слои ила и торфа</text><circle cx="640" cy="790" r="50" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="640" y="796" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="16" fill="#666">колесо</text><rect x="720" y="780" width="240" height="24" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="840.0" y="798.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">ось</text><text x="64" y="170" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="36" fill="#111"><tspan x="64" dy="0">Пять тысяч лет в</tspan><tspan x="64" dy="43.199999999999996">полной тишине.</tspan></text><text x="1376" y="780" text-anchor="end" font-family="Alegreya, Georgia, serif" font-size="48" fill="#111"><tspan x="1376" dy="0">И вдруг — тук.</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">3.2 · Разрез</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 3 · средний (3) · плотность 2 · камера опускается сквозь слои</text></g></g></svg>