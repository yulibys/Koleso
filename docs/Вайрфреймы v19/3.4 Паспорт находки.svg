<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="3.4 Паспорт находки"><rect width="1440" height="900" fill="#EDEDED"/><circle cx="330" cy="420" r="200" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="330" y="426" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="16" fill="#666">колесо</text><rect x="120" y="680" width="520" height="36" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="380.0" y="704.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">ось</text><text x="760" y="200" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="24" fill="#111"><tspan x="760" dy="0">размер — 72 см</tspan><tspan x="760" dy="28.799999999999997">материал — ясень</tspan><tspan x="760" dy="28.799999999999997">ось — дуб, 124 см</tspan><tspan x="760" dy="28.799999999999997">крепление — квадратное отверстие</tspan></text><text x="760" y="430" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="26" fill="#111"><tspan x="760" dy="0">Ось крутилась вместе с колесом.</tspan><tspan x="760" dy="31.2">Поворачивать на такой телеге было</tspan><tspan x="760" dy="31.2">мучением.</tspan></text><text x="760" y="640" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="22" fill="#111"><tspan x="760" dy="0">Колесо и ось из Люблянских болот — материал</tspan><tspan x="760" dy="26.4">Городского музея Любляны →</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">3.4 · Паспорт находки</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 3 · средний (3) · плотность 4 · соседская дверь</text></g></g></svg>