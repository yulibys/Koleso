<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="4.2 Куча"><rect width="1440" height="900" fill="#EDEDED"/><text x="64" y="130" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="64" fill="#111"><tspan x="64" dy="0">Всё есть. Движения нет.</tspan></text><text x="64" y="200" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="26" fill="#111"><tspan x="64" dy="0">колесо + ось + кузов + груз + бык + дорога</tspan></text><circle cx="260" cy="380" r="110" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="260" y="386" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="16" fill="#666">колесо</text><rect x="480" y="350" width="380" height="30" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="670.0" y="371.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">ось</text><rect x="960" y="260" width="380" height="200" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="1150.0" y="366.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">кузов</text><rect x="140" y="600" width="220" height="150" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="250.0" y="681.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">груз</text><rect x="480" y="560" width="380" height="260" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="670.0" y="696.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">бык</text><rect x="960" y="680" width="400" height="80" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="1160.0" y="726.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">дорога</text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">4.2 · Куча</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 4 · дальний (5) · плотность 4 · детали влетают по одной</text></g></g></svg>