<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="2.3 Остановка"><rect width="1440" height="900" fill="#1E1E1E"/><text x="720" y="400" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="80" fill="#F0F0F0"><tspan x="720" dy="0">Около 3150 года до нашей эры</tspan></text><text x="720" y="520" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="26" fill="#F0F0F0"><tspan x="720" dy="0">Столько лет колесу из Люблянских болот. Это возраст</tspan><tspan x="720" dy="31.2">находки, а не день изобретения.</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">2.3 · Остановка</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 2 · деталь (1) · плотность 2 · даты разведены</text></g></g></svg>