<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="7.4 Сансара"><rect width="1440" height="900" fill="#1E1E1E"/><rect x="40" y="40" width="1360" height="820" fill="none" stroke="#AAA" stroke-width="1.5"/><text x="720" y="400" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="44" fill="#F0F0F0"><tspan x="720" dy="0">А вы, кажется, попали в колесо сансары.</tspan><tspan x="720" dy="52.8">Этот лонгрид вам теперь читать вечно.</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">7.4 · Сансара</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 7 · деталь (1) · плотность 1 · шов 5→1 ✓ · перемотку можно отменить</text></g></g></svg>