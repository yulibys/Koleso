<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="3.3 Колесо"><rect width="1440" height="900" fill="#EDEDED"/><circle cx="720" cy="420" r="260" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="720" y="426" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="16" fill="#666">колесо крупно, виден скол</text><text x="720" y="820" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="36" fill="#111"><tspan x="720" dy="0">Колесо. А рядом с ним — ось.</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">3.3 · Колесо</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 3 · деталь (1) · плотность 1 · улика и пауза</text></g></g></svg>