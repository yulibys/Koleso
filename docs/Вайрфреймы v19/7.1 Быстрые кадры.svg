<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="7.1 Быстрые кадры"><rect width="1440" height="900" fill="#EDEDED"/><rect x="0" y="0" width="720" height="450" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="360.0" y="231.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">автобус</text><rect x="720" y="0" width="720" height="450" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="1080.0" y="231.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">руль</text><rect x="0" y="450" width="720" height="450" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="360.0" y="681.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">колесо обозрения</text><rect x="720" y="450" width="720" height="450" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="1080.0" y="681.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">таблетка</text><text x="40" y="420" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="22" fill="#111"><tspan x="40" dy="0">Автобус в 7:40. Следующий — в 8:10.</tspan></text><text x="760" y="420" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="22" fill="#111"><tspan x="760" dy="0">Руль. Он же рулевое колесо.</tspan></text><text x="40" y="870" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="22" fill="#111"><tspan x="40" dy="0">Колесо обозрения. Катаемся по кругу добровольно.</tspan></text><text x="760" y="870" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="22" fill="#111"><tspan x="760" dy="0">Таблетка. В просторечии — тоже колесо.</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">7.1 · Быстрые кадры</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 7 Кто кого · деталь (1) · плотность 2 · в коде — по кадру на весь экран, не больше пяти</text></g></g></svg>