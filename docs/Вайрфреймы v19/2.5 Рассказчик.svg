<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="2.5 Рассказчик"><rect width="1440" height="900" fill="#1E1E1E"/><rect x="40" y="40" width="1360" height="820" fill="none" stroke="#AAA" stroke-width="1.5"/><text x="720" y="440" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="48" fill="#F0F0F0"><tspan x="720" dy="0">Сейчас вы, конечно, прокрутите дальше.</tspan></text><text x="720" y="620" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#AAA" font-style="italic"><tspan x="720" dy="0">если читатель крутит назад: «Да. Сначала ещё раз посмотрим.»</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">2.5 · Рассказчик</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 2 · деталь (1) · плотность 1 · интертитр</text></g></g></svg>