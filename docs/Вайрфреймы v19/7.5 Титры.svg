<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="7.5 Титры"><rect width="1440" height="900" fill="#EDEDED"/><text x="64" y="70" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="20" fill="#111"><tspan x="64" dy="0">Одного колеса мало</tspan></text><line x1="0" y1="620" x2="1440" y2="620" stroke="#111" stroke-width="2"/><text x="720" y="250" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="140" fill="#111"><tspan x="720" dy="0">Колесо</tspan></text><circle cx="720" cy="520" r="100" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="720" y="526" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="16" fill="#666">то же колесо со сколом</text><text x="720" y="720" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="24" fill="#111"><tspan x="720" dy="0">Конец. Вы вернулись туда, откуда вошли. История начнётся снова.</tspan></text><text x="720" y="770" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#111"><tspan x="720" dy="0">студент Юлия Бысова · преподаватель Олег Пащенко · группа Б25ДЗ09</tspan></text><rect x="630" y="800" width="180" height="56" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="720.0" y="834.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">⟳ Начать заново</text><text x="1376" y="870" text-anchor="end" font-family="Alegreya, Georgia, serif" font-size="18" fill="#111"><tspan x="1376" dy="0">соседи по веб-рингу →</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">7.5 · Титры</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 7 · средний (3) · плотность 2 · изменённое возвращение, выходная дверь</text></g></g></svg>