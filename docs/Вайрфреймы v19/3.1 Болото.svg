<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="3.1 Болото"><rect width="1440" height="900" fill="#EDEDED"/><text x="64" y="150" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="72" fill="#111"><tspan x="64" dy="0">Люблянские болота</tspan></text><text x="64" y="215" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="32" fill="#111"><tspan x="64" dy="0">2002 год</tspan></text><text x="64" y="300" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="24" fill="#111"><tspan x="64" dy="0">Торф не пускает воздух. Без воздуха</tspan><tspan x="64" dy="28.799999999999997">дерево не гниёт. Оно просто ждёт.</tspan></text><rect x="740" y="90" width="640" height="560" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="1060.0" y="376.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">картина Августа Гроса: свайные посёлки</text><text x="740" y="690" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="18" fill="#111"><tspan x="740" dy="0">Свайные посёлки на Люблянском болоте. Так их представлял художник</tspan><tspan x="740" dy="21.599999999999998">Август Грос</tspan></text><text x="64" y="820" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="24" fill="#111"><tspan x="64" dy="0">осторожно, тут топко</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">3.1 · Болото</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 3 Находка · дальний (5) · плотность 3 · шов 1→5 ✓ крайние</text></g></g></svg>