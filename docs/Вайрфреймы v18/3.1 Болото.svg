<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="3.1 Болото"><rect width="1440" height="900" fill="#EDEDED"/><rect x="0" y="250" width="1440" height="650" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="720.0" y="581.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">болото, дальний план: тростник, вода, туман</text><text x="64" y="160" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="64" fill="#111"><tspan x="64" dy="0">Люблянские болота, Словения</tspan></text><text x="1376" y="215" text-anchor="end" font-family="Alegreya, Georgia, serif" font-size="24" fill="#111"><tspan x="1376" dy="0">Осторожно, тут топко.</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">3.1 · Болото</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 3 «Находка» · показать место · дальний план · плотность 2 · смена медиума: рисунок → болото</text></g></g></svg>