<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="3.2 Разрез"><rect width="1440" height="900" fill="#EDEDED"/><rect x="420" y="0" width="600" height="900" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="720.0" y="456.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">разрез земли: слои ила и торфа</text><circle cx="640" cy="790" r="50" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="640" y="796" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="16" fill="#666">колесо</text><rect x="720" y="780" width="240" height="24" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="840.0" y="798.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">ось</text><text x="64" y="170" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="40" fill="#111"><tspan x="64" dy="0">Пять тысяч</tspan><tspan x="64" dy="48.0">лет ила</tspan></text><text x="1080" y="800" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666" font-style="italic"><tspan x="1080" dy="0">слои подписываются по мере</tspan><tspan x="1080" dy="21.599999999999998">спуска</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">3.2 · Разрез</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 3 · спуститься вглубь времени · разрез, средний план · плотность 2 · по скроллу камера опускается сквозь слои</text></g></g></svg>