<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="7.3 Кто кого"><rect width="1440" height="900" fill="#EDEDED"/><circle cx="90" cy="110" r="60" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><circle cx="1350" cy="130" r="70" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><circle cx="120" cy="790" r="70" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><circle cx="1330" cy="780" r="60" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><circle cx="720" cy="90" r="40" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="720" y="420" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="56" fill="#111"><tspan x="720" dy="0">Мы собрали колесо. Теперь оно собирает нас.</tspan></text><text x="720" y="580" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="40" fill="#111"><tspan x="720" dy="0">Кто кого собрал?</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">7.3 · Кто кого</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 7 · перевернуть отношения · общий план · плотность 2 · все колёса въезжают со всех сторон</text></g></g></svg>