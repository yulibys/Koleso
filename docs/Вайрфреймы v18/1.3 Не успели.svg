<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="1.3 Не успели"><rect width="1440" height="900" fill="#EDEDED"/><line x1="0" y1="620" x2="1440" y2="620" stroke="#111" stroke-width="2"/><text x="64" y="150" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="56" fill="#111"><tspan x="64" dy="0">Не успели.</tspan></text><text x="1376" y="150" text-anchor="end" font-family="Alegreya, Georgia, serif" font-size="56" fill="#111"><tspan x="1376" dy="0">Оно укатилось.</tspan></text><text x="64" y="800" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="56" fill="#111"><tspan x="64" dy="0">Вот такие они,</tspan></text><text x="1376" y="800" text-anchor="end" font-family="Alegreya, Georgia, serif" font-size="56" fill="#111"><tspan x="1376" dy="0">колёса.</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">1.3 · Не успели</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 1 · дать почувствовать потерю · общий план, пустой горизонт · плотность 2 · реплики появляются по Z и остаются все четыре</text></g></g></svg>