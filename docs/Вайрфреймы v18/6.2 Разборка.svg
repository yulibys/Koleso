<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="6.2 Разборка"><rect width="1440" height="900" fill="#EDEDED"/><text x="100" y="140" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="36" fill="#111"><tspan x="100" dy="0">— А ось? — Нет. — А кузов? — Нет.</tspan><tspan x="100" dy="43.199999999999996">— Так где же колесница?</tspan></text><circle cx="200" cy="450" r="90" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="200" y="456" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="16" fill="#666">колесо</text><rect x="380" y="300" width="300" height="30" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="530.0" y="321.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">ось</text><rect x="900" y="250" width="360" height="180" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="1080.0" y="346.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">кузов</text><rect x="500" y="560" width="320" height="40" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="660.0" y="586.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">дышло</text><rect x="1000" y="560" width="260" height="160" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="1130.0" y="646.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">ярмо</text><text x="720" y="770" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="28" fill="#111"><tspan x="720" dy="0">колесница</tspan></text><text x="720" y="850" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666" font-style="italic"><tspan x="720" dy="0">подпись стоит на месте, а предмета уже нет</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">6.2 · Разборка</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 6 · разобрать: имя осталось, предмета нет · детали · плотность 5 · части разъезжаются в стороны по скроллу</text></g></g></svg>