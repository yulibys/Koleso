<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="5.3 Поехали"><rect width="1440" height="900" fill="#EDEDED"/><line x1="0" y1="560" x2="1440" y2="560" stroke="#111" stroke-width="2"/><rect x="380" y="300" width="680" height="260" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="720.0" y="436.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">повозка с быком на дороге, человек сел</text><text x="64" y="140" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="56" fill="#111"><tspan x="64" dy="0">Поехали.</tspan></text><text x="64" y="215" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="24" fill="#111"><tspan x="64" dy="0">Ни одна деталь не умела ехать. Вместе — едут.</tspan></text><rect x="120" y="700" width="180" height="90" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="210.0" y="751.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">✓ колесо</text><rect x="330" y="700" width="180" height="90" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="420.0" y="751.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">✓ ось</text><rect x="540" y="700" width="180" height="90" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="630.0" y="751.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">✓ кузов</text><rect x="750" y="700" width="180" height="90" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="840.0" y="751.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">✓ бык</text><rect x="960" y="700" width="180" height="90" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="1050.0" y="751.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">✓ дорога</text><rect x="1170" y="700" width="180" height="90" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="1260.0" y="751.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">✓ человек</text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">5.3 · Поехали</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 5 · объяснить: вместе — новое действие · средний план · плотность 4 · повозка трогается</text></g></g></svg>