<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="7.1 Утро"><rect width="1440" height="900" fill="#EDEDED"/><rect x="0" y="0" width="720" height="450" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="360.0" y="231.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">автобус, 7:40</text><rect x="720" y="0" width="720" height="450" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="1080.0" y="231.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">руль</text><rect x="0" y="450" width="720" height="450" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="360.0" y="681.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">колесо обозрения</text><rect x="720" y="450" width="720" height="450" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="1080.0" y="681.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">таблетка-«колесо» (подписано как шутка)</text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">7.1 · Утро</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 7 «Кто кого собрал» · перенести в сегодняшний день · быстрые детали · плотность 3 · в коде — по кадру на весь экран, смена по скроллу</text></g></g></svg>