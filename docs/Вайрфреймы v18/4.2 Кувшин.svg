<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="4.2 Кувшин"><rect width="1440" height="900" fill="#EDEDED"/><rect x="120" y="140" width="560" height="660" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="400.0" y="476.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">кувшин из Броночице</text><rect x="760" y="140" width="560" height="380" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="1040.0" y="336.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">деталь: процарапанная повозка</text><text x="760" y="600" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="28" fill="#111"><tspan x="760" dy="0">На глиняном боку процарапаны</tspan><tspan x="760" dy="33.6">повозки. Кувшин нашли в Польше, в</tspan><tspan x="760" dy="33.6">деревне Броночице.</tspan></text><text x="760" y="770" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="22" fill="#111"><tspan x="760" dy="0">Что нарисовали на кувшине из Броночице →</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">4.2 · Кувшин</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 4 · доказать, что сборка уже была · крупный → деталь · плотность 4 · углубляющая дверь</text></g></g></svg>