<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="3.3 Находка"><rect width="1440" height="900" fill="#EDEDED"/><circle cx="470" cy="450" r="230" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="470" y="456" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="16" fill="#666">колесо крупно, видно скол на ободе</text><rect x="780" y="640" width="560" height="40" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="1060.0" y="666.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">ось</text><text x="800" y="230" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="30" fill="#111"><tspan x="800" dy="0">Колесо — ясень. Ось — дуб.</tspan><tspan x="800" dy="36.0">Найдены в 2002 году.</tspan></text><text x="800" y="370" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666" font-style="italic"><tspan x="800" dy="0">факты сверить с музейным источником</tspan></text><text x="800" y="520" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="24" fill="#111"><tspan x="800" dy="0">Как колесо пролежало пять тысяч лет в</tspan><tspan x="800" dy="28.799999999999997">болоте →</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">3.3 · Находка</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 3 · дать материальную опору · крупный план · плотность 3 · соседская дверь</text></g></g></svg>