<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="2.4 Как догнать"><rect width="1440" height="900" fill="#EDEDED"/><line x1="0" y1="620" x2="1440" y2="620" stroke="#111" stroke-width="2"/><circle cx="220" cy="590" r="30" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="220" y="596" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="16" fill="#666">колесо</text><rect x="300" y="500" width="70" height="120" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="335.0" y="566.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">человек</text><text x="720" y="190" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="64" fill="#111"><tspan x="720" dy="0">Как теперь его догнать?</tspan></text><text x="64" y="850" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="32" fill="#111"><tspan x="64" dy="0">Бежать следом</tspan></text><text x="1376" y="850" text-anchor="end" font-family="Alegreya, Georgia, serif" font-size="32" fill="#111"><tspan x="1376" dy="0">Взять второе</tspan></text><text x="720" y="320" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666" font-style="italic"><tspan x="720" dy="0">после выбора рассказчик: «Хороший план. Только сначала колесо надо найти.»</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">2.4 · Как догнать</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 2 → 3 · вернуть колесо и дать читателю выбор · дальний план горизонта · плотность 2 · маленькое колесо катится обратно слева</text></g></g></svg>