<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="2.2 Перемотка"><rect width="1440" height="900" fill="#1E1E1E"/><text x="720" y="470" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="140" fill="#F0F0F0"><tspan x="720" dy="0">1024 г.</tspan></text><text x="1376" y="90" text-anchor="end" font-family="Alegreya, Georgia, serif" font-size="24" fill="#F0F0F0"><tspan x="1376" dy="0">назад</tspan></text><text x="720" y="700" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#AAA" font-style="italic"><tspan x="720" dy="0">цифры несутся так быстро, что прочесть нельзя — и не нужно; переход заканчивается там, где</tspan><tspan x="720" dy="21.599999999999998">можно спокойно читать</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">2.2 · Перемотка</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 2 · перенести назад во времени · деталь · плотность 1 · цифры несутся назад, полосы перемотки</text></g></g></svg>