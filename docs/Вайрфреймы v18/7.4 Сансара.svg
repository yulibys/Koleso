<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="7.4 Сансара"><rect width="1440" height="900" fill="#1E1E1E"/><rect x="40" y="40" width="1360" height="820" fill="none" stroke="#AAA" stroke-width="1.5"/><text x="720" y="390" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="40" fill="#F0F0F0"><tspan x="720" dy="0">Помните Нагасену? Колесо, ось, кузов… А вы</tspan><tspan x="720" dy="48.0">теперь в колесе сансары. Этот лонгрид вам</tspan><tspan x="720" dy="48.0">читать вечно.</tspan></text><text x="720" y="700" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#AAA" font-style="italic"><tspan x="720" dy="0">сансара здесь — метафора шутки, у диалога о колеснице свой вопрос о личности</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">7.4 · Сансара</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 7 · интертитр: шутка про сансару · деталь (текст) · плотность 1 · через 3–4 с страница сама отматывается</text></g></g></svg>