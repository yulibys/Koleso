<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="4.3 Игрушки"><rect width="1440" height="900" fill="#EDEDED"/><rect x="120" y="180" width="520" height="560" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="380.0" y="466.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">глиняная игрушка на колёсиках, Мезоамерика</text><text x="760" y="250" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="40" fill="#111"><tspan x="760" dy="0">А в Мексике колёса делали</tspan><tspan x="760" dy="48.0">для игрушек.</tspan></text><text x="760" y="430" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="28" fill="#111"><tspan x="760" dy="0">Повозок не было: тянуть некому,</tspan><tspan x="760" dy="33.6">ехать негде. Колесо было. Соседей не</tspan><tspan x="760" dy="33.6">было.</tspan></text><text x="760" y="700" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="22" fill="#111"><tspan x="760" dy="0">Почему игрушки ездили, а люди нет →</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">4.3 · Игрушки</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 4 · достойное возражение, которое работает на тезис · крупный план · плотность 4 · проверочная дверь</text></g></g></svg>