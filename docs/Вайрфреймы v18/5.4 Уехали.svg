<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="5.4 Уехали"><rect width="1440" height="900" fill="#EDEDED"/><line x1="0" y1="560" x2="1440" y2="560" stroke="#111" stroke-width="2"/><rect x="1300" y="420" width="300" height="140" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="1450.0" y="496.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">повозка уходит за край</text><text x="720" y="800" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666" font-style="italic"><tspan x="720" dy="0">только горизонт, без текста</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">5.4 · Уехали</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 5 → 6 · передышка перед самой плотной зоной · дальний план · плотность 1 · повозка уезжает за край</text></g></g></svg>