<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="964" viewBox="0 0 1440 964"><g id="6.3 Обратно"><rect width="1440" height="900" fill="#EDEDED"/><text x="100" y="140" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="30" fill="#111"><tspan x="100" dy="0">Колесница — это имя для того, что собралось вместе. Нагасена говорил так о</tspan><tspan x="100" dy="36.0">человеке: «я» — тоже имя для сборки.</tspan></text><rect x="420" y="300" width="600" height="320" fill="#D2D2D2" stroke="#9A9A9A" stroke-dasharray="8 6" stroke-width="1.5"/><text x="720.0" y="466.0" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="18" fill="#666">колесница собирается обратно</text><text x="720" y="690" text-anchor="middle" font-family="Alegreya, Georgia, serif" font-size="28" fill="#111"><tspan x="720" dy="0">колесница</tspan></text><text x="100" y="850" text-anchor="start" font-family="Alegreya, Georgia, serif" font-size="22" fill="#111"><tspan x="100" dy="0">«Вопросы Милинды»: диалог целиком →</tspan></text><g id="служебное"><rect y="900" width="1440" height="64" fill="#FFFFFF"/><text x="24" y="928" font-family="Alegreya, Georgia, serif" font-size="16" fill="#555">6.3 · Обратно</text><text x="24" y="950" font-family="Alegreya, Georgia, serif" font-size="14" fill="#777">Зона 6 · собрать обратно и назвать вопрос · средний план · плотность 4 · части съезжаются · углубляющая дверь</text></g></g></svg>